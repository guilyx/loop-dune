# Production stack for a single VPS. Use through ./stack.sh (it adds the env files):
#
#   ./stack.sh up -d            start everything
#   ./stack.sh deploy <tag>     pull images for a release and restart
#   ./stack.sh logs -f indexer  follow logs
#
# Only Caddy publishes ports (80/443). Postgres and the dashboard sit on internal
# networks with no route to the internet; the dashboard connects with a read-only role.
name: loop

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loop
      POSTGRES_DB: loop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # read by initdb/10-roles.sh on first start only
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?set DASHBOARD_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=2000
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 10s
      start_interval: 2s
      retries: 10
    networks: [backend]
    logging: *logging

  indexer:
    image: ${REGISTRY:-ghcr.io/guilyx}/loop-dune-indexer:${IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: indexer/Dockerfile }
    restart: unless-stopped
    command: ["schedule"]      # migrate, then index -> Dune -> health every hour at :17
    stop_grace_period: 2m      # let an in-flight snapshot finish on deploys
    environment:
      DATABASE_URL: postgresql://loop:${POSTGRES_PASSWORD}@db:5432/loop
      ETH_RPC_URLS: ${ETH_RPC_URLS:?set ETH_RPC_URLS in .env}
      BSC_RPC_URLS: ${BSC_RPC_URLS:?set BSC_RPC_URLS in .env}
      DUNE_API_KEY: ${DUNE_API_KEY:-}
      DUNE_NAMESPACE: ${DUNE_NAMESPACE:-}
      HEARTBEAT_URL: ${INDEXER_HEARTBEAT_URL:-}
      # refresh the dashboard's cached pages as soon as a cycle lands new data
      DASHBOARD_REVALIDATE_URL: http://dashboard:3000/api/revalidate
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
      LOG_FORMAT: json
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, egress]
    logging: *logging

  dashboard:
    image: ${REGISTRY:-ghcr.io/guilyx}/loop-dune-dashboard:${IMAGE_TAG:-latest}
    build:
      context: ../../dashboard
      args: { NEXT_PUBLIC_DUNE_NAMESPACE: "${DUNE_NAMESPACE:-}" }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dashboard:${DASHBOARD_DB_PASSWORD}@db:5432/loop
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/markets').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      retries: 3
      start_period: 60s
      start_interval: 3s
    networks: [backend, web]   # no internet access
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (or :80 to serve plain HTTP on the IP)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [dashboard]
    networks: [web, egress]
    logging: *logging

  backup:
    image: ${REGISTRY:-ghcr.io/guilyx}/loop-dune-backup:${IMAGE_TAG:-latest}
    build: { context: ../backup }
    restart: unless-stopped
    environment:
      BACKUP_DATABASE_URL: postgresql://loop:${POSTGRES_PASSWORD}@db:5432/loop
      BACKUP_AT: ${BACKUP_AT:-03:17}
      VERIFY_WEEKDAY: ${BACKUP_VERIFY_WEEKDAY:-0}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_KEEP_DAILY_DAYS: ${BACKUP_KEEP_DAILY_DAYS:-14}
      BACKUP_KEEP_MONTHLY_DAYS: ${BACKUP_KEEP_MONTHLY_DAYS:-400}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      VERIFY_HEARTBEAT_URL: ${BACKUP_VERIFY_HEARTBEAT_URL:-}
      # Offsite copy through any S3-compatible store (Backblaze B2, Cloudflare R2, AWS,
      # Hetzner, Wasabi, MinIO). Leave BACKUP_REMOTE empty to keep backups local only.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - backups:/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, egress]
    logging: *logging

networks:
  backend:            # Postgres; no route to the internet
    internal: true
  web:                # Caddy -> dashboard
    internal: true
  egress: {}          # outbound: RPC, Dune, ACME, offsite backups

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
