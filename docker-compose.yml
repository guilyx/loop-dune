# Local stack: Postgres + indexer jobs + dashboard.
#
#   cp .env.example .env            # add archive RPC URLs
#   docker compose up -d db dashboard
#   docker compose run --rm indexer db migrate
#   docker compose run --rm indexer run --interval 1d     # quick backfill
#   docker compose --profile scheduler up -d scheduler    # hourly loop, like CI cron
#
# For a production server, use deploy/vps/ instead (HTTPS, backups, read-only roles).
name: loop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: loop
      POSTGRES_DB: loop
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 5s
      retries: 10

  indexer:
    build: { context: ., dockerfile: indexer/Dockerfile }
    image: loop-indexer
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://loop:loop@db:5432/loop
    depends_on: { db: { condition: service_healthy } }
    profiles: [jobs]

  scheduler:
    build: { context: ., dockerfile: indexer/Dockerfile }
    image: loop-indexer
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://loop:loop@db:5432/loop
    depends_on: { db: { condition: service_healthy } }
    command: ["schedule"]   # migrate, then index -> Dune -> health every hour at :17
    stop_grace_period: 2m
    restart: unless-stopped
    profiles: [scheduler]

  dashboard:
    build: { context: ./dashboard }
    environment:
      DATABASE_URL: postgresql://loop:loop@db:5432/loop
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
