# Loop Protocol contract registry.
#
# Describes *what exists* on-chain. The metrics sampled for each entity are defined in
# code (loop_indexer/registry.py) so every market is measured identically.
#
# Every fact below was read from chain, not copied from a UI:
#   * tokens/decimals via symbol()/decimals(), pool.asset(), staking.asset(), vault.token()
#   * deployment blocks via eth_getCode binary search (loop_indexer.chain.deploy)
#   * vault lists via pool.creditManagers()
# `loop-indexer registry verify` re-checks all of it against an archive node and fails
# if anything drifted (e.g. a new vault was added to a pool).

version: 1

chains:
  ethereum:
    chain_id: 1
    name: Ethereum
    rpc_urls_env: ETH_RPC_URLS
    explorer: https://etherscan.io
  bsc:
    chain_id: 56
    name: BNB Smart Chain
    rpc_urls_env: BSC_RPC_URLS
    explorer: https://bscscan.com

