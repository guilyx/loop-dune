version: 2
updates:
  - package-ecosystem: uv
    directory: /indexer
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: [/indexer, /dashboard]
    schedule: { interval: monthly }
