# Grouped updates: one PR per ecosystem and schedule, so bumps that touch neighbouring
# lines (e.g. several actions in one workflow) never conflict with each other.
version: 2
updates:
  - package-ecosystem: uv
    directory: /indexer
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /docs
    schedule: { interval: monthly }
    groups: { docs: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/indexer, /dashboard, /deploy/backup]
    schedule: { interval: monthly }
    ignore:
      # The backup image's pg_dump/pg_restore must match the database's major version
      # (postgres:16 in deploy/vps): a newer pg_restore emits settings Postgres 16
      # rejects. Upgrade both together, deliberately, with a dump and restore.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
