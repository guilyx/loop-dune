name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  indexer:
    name: Indexer (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop
          POSTGRES_DB: loop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop -d loop_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://loop:loop@localhost:5432/loop_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: indexer/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: indexer/coverage.xml

  dashboard:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-config:
    name: Config lint (workflows, shellcheck, compose, Caddyfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR deploy/backup/*.sh deploy/vps/*.sh deploy/vps/initdb/*.sh
      - name: VPS compose file renders
        run: |
          sed -e 's/^\(POSTGRES_PASSWORD\|DASHBOARD_DB_PASSWORD\|ETH_RPC_URLS\|BSC_RPC_URLS\)=$/\1=ci/' \
            deploy/vps/.env.example > "$RUNNER_TEMP/vps.env"
          docker compose -f deploy/vps/docker-compose.yml --env-file "$RUNNER_TEMP/vps.env" config --quiet
      - name: Caddyfile is valid
        run: |
          docker run --rm -e DOMAIN=loop.example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backups:
    name: Backups (image, restore round trip)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop
          POSTGRES_DB: loop_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop -d loop_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://loop:loop@localhost:5432/loop_ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: indexer/uv.lock
      - name: Migrate and seed
        working-directory: indexer
        run: |
          uv sync --frozen --no-dev
          uv run loop-indexer db migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ../deploy/backup/testdata.sql
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          load: true
          tags: loop-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      - name: Backup -> offsite -> restore -> drill, inside the image
        run: docker run --rm --network host -e DATABASE_URL loop-backup:ci roundtrip

  images:
    name: Docker images (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: indexer/Dockerfile
          load: true
          tags: loop-indexer:ci
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,mode=max,scope=indexer
      # A build can succeed with a broken runtime (e.g. packages built for another
      # Python), so start each image and exercise it.
      - name: Indexer image starts and loads its registry
        run: |
          docker run --rm loop-indexer:ci --help > /dev/null
          docker run --rm loop-indexer:ci registry show | tail -n 3
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          load: true
          tags: loop-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Dashboard image serves pages and the API
        run: |
          docker run -d --name dashboard -p 3000:3000 loop-dashboard:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fsS http://localhost:3000/api/markets | jq -e '.markets | length > 0' > /dev/null
          curl -fsS -o /dev/null http://localhost:3000/markets/eth
          curl -fsS -o "$RUNNER_TEMP/eth.csv" "http://localhost:3000/api/markets/eth?format=csv"
          head -n 2 "$RUNNER_TEMP/eth.csv"
      - name: Dashboard logs
        if: always()
        run: docker logs dashboard 2>&1 | tail -n 50 || true
