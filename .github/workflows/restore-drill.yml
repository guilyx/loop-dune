name: Restore drill

# Weekly proof that the offsite backups can be restored: download the newest backup
# from the bucket, check its checksum, decrypt it with the age private key (held only
# here, as a secret, never on the server), restore it into a throwaway Postgres and
# check that the tables and views compute. Fails if the newest backup is too old.
#
# Disabled until the repository variable RESTORE_DRILL_ENABLED is "true".
# Variables: BACKUP_REMOTE (e.g. offsite:my-bucket/loop), OFFSITE_S3_PROVIDER,
#            OFFSITE_S3_ENDPOINT, OFFSITE_S3_REGION, BACKUP_MAX_AGE_HOURS (default 30)
# Secrets:   BACKUP_AGE_KEY (private key file contents), OFFSITE_S3_ACCESS_KEY_ID,
#            OFFSITE_S3_SECRET_ACCESS_KEY (read-only credentials are enough),
#            RESTORE_DRILL_HEARTBEAT_URL (optional)
# See docs/backups.md.

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays, after the Sunday-night backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    if: vars.RESTORE_DRILL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop
          POSTGRES_DB: loop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loop -d loop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          load: true
          tags: loop-backup:drill
          cache-from: type=gha,scope=backup
      - name: Restore the newest offsite backup and check it
        env:
          BACKUP_AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
          DATABASE_URL: postgresql://loop:loop@localhost:5432/loop
          BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}
          VERIFY_MAX_AGE_HOURS: ${{ vars.BACKUP_MAX_AGE_HOURS || '30' }}
          VERIFY_HEARTBEAT_URL: ${{ secrets.RESTORE_DRILL_HEARTBEAT_URL }}
          RCLONE_CONFIG_OFFSITE_TYPE: s3
          RCLONE_CONFIG_OFFSITE_PROVIDER: ${{ vars.OFFSITE_S3_PROVIDER || 'Other' }}
          RCLONE_CONFIG_OFFSITE_ENDPOINT: ${{ vars.OFFSITE_S3_ENDPOINT }}
          RCLONE_CONFIG_OFFSITE_REGION: ${{ vars.OFFSITE_S3_REGION || 'auto' }}
          RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${{ secrets.OFFSITE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${{ secrets.OFFSITE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
        run: |
          [[ -n "$BACKUP_REMOTE" && -n "$BACKUP_AGE_KEY" ]] || { echo "set BACKUP_REMOTE and BACKUP_AGE_KEY"; exit 1; }
          # The key goes in on stdin: not in the container's environment or `docker inspect`,
          # and gone with the container.
          printf '%s\n' "$BACKUP_AGE_KEY" | docker run --rm -i --network host \
            -e DATABASE_URL -e BACKUP_REMOTE -e VERIFY_MAX_AGE_HOURS -e VERIFY_HEARTBEAT_URL \
            -e BACKUP_AGE_IDENTITY=- \
            -e RCLONE_CONFIG_OFFSITE_TYPE -e RCLONE_CONFIG_OFFSITE_PROVIDER -e RCLONE_CONFIG_OFFSITE_ENDPOINT \
            -e RCLONE_CONFIG_OFFSITE_REGION -e RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID \
            -e RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY -e RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET \
            loop-backup:drill verify
